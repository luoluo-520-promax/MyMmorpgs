spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:update_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

game:
  internal-api:
    enabled: false
    secret: ${INTERNAL_API_SECRET:dev-internal-api-secret}
