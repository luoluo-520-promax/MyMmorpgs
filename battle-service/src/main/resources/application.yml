spring:
  application:
    name: battle-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB_BATTLE:battle_db}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

server:
  port: 8991

rocketmq:
  enabled: ${ROCKETMQ_ENABLED:false}
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: battle-producer-group
    send-message-timeout: 3000

battle:
  mq:
    topic: ${BATTLE_MQ_TOPIC:BATTLE_EVENTS}
  projection:
    enabled: ${BATTLE_PROJECTION_ENABLED:true}
    activity-url: ${ACTIVITY_SERVICE_URL:http://127.0.0.1:8992}
    quest-url: ${QUEST_SERVICE_URL:http://127.0.0.1:8987}
  abyss:
    config-path: ${BATTLE_ABYSS_CONFIG_PATH:classpath:config/abyss/abyss_floor_config.json}

game:
  internal-api:
    enabled: ${GAME_INTERNAL_API_ENABLED:true}
    secret: ${INTERNAL_API_SECRET:}
  port:
    remote:
      enabled: ${GAME_PORT_REMOTE_ENABLED:false}
      player-service-url: ${PLAYER_SERVICE_URL:http://127.0.0.1:8989}
      scene-service-url: ${SCENE_SERVICE_URL:http://127.0.0.1:8981}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
