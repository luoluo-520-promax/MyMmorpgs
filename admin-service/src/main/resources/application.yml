spring:
  application:
    name: admin-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB_PLAYER:player_db}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 30000
          activity-service:
            url: ${ACTIVITY_SERVICE_URL:http://127.0.0.1:8992}
          update-service:
            url: ${UPDATE_SERVICE_URL:http://127.0.0.1:8993}
          ai-service:
            url: ${AI_SERVICE_URL:http://127.0.0.1:8995}
          battle-service:
            url: ${BATTLE_SERVICE_URL:http://127.0.0.1:8991}
          player-service:
            url: ${PLAYER_SERVICE_URL:http://127.0.0.1:8989}
          # 嵌入模式任务热更打到 player；独立 quest-service 时改为 http://127.0.0.1:8987
          quest-service:
            url: ${QUEST_SERVICE_URL:http://127.0.0.1:8989}
          # 嵌入模式默认打到 player（承载 ShopService）；独立 shop-service 时改为 http://127.0.0.1:8990
          shop-service:
            url: ${SHOP_SERVICE_URL:http://127.0.0.1:8989}

server:
  port: 8985

admin:
  http:
    ip-whitelist-enabled: ${ADMIN_IP_WHITELIST_ENABLED:true}
    auth-enabled: ${ADMIN_AUTH_ENABLED:true}
    hmac-secret: ${ADMIN_HMAC_SECRET:}
    api-key: ${ADMIN_API_KEY:}
    ips:
      - 127.0.0.1
  ai:
    enabled: ${ADMIN_AI_ENABLED:false}
    api-key: ${ADMIN_AI_API_KEY:}
    base-url: ${ADMIN_AI_BASE_URL:https://api.openai.com/v1}
    model: ${ADMIN_AI_MODEL:gpt-4o-mini}
    timeout-ms: ${ADMIN_AI_TIMEOUT_MS:60000}
    prompt-version: ${ADMIN_AI_PROMPT_VERSION:activity-copilot-v1}
    confirm-ttl-ms: ${ADMIN_AI_CONFIRM_TTL_MS:1800000}

game:
  ai:
    remote:
      enabled: ${GAME_AI_REMOTE_ENABLED:false}
  internal-api:
    enabled: ${GAME_INTERNAL_API_ENABLED:true}
    secret: ${INTERNAL_API_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
