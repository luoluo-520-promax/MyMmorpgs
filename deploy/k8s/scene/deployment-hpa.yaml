# Scene Fleet (K8s HPA) — 替代进程内 Job 模式
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scene-service
  labels:
    app: scene-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scene-service
  template:
    metadata:
      labels:
        app: scene-service
    spec:
      containers:
        - name: scene
          image: mymmorpg/scene-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: GAME_SCENE_REGISTER_TO_CENTER
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scene-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scene-service
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: v1
kind: Service
metadata:
  name: scene-service
spec:
  selector:
    app: scene-service
  ports:
    - port: 8082
      targetPort: 8082
