spring:
  application:
    name: mmorpg-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisReactiveHealthContributorAutoConfiguration
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 单体模式：全部转发 player-service；微服务拆分见 application-split.yml（profile=split）
        - id: player-service
          uri: lb://player-service
          predicates:
            - Path=/player/**,/ws/**,/battle/**,/activity/**,/api/security/**

server:
  port: ${GATEWAY_PORT:8443}
  ssl:
    enabled: ${GATEWAY_SSL_ENABLED:false}
    key-store: ${GATEWAY_SSL_KEY_STORE:classpath:certs/gateway-keystore.p12}
    key-store-password: ${GATEWAY_SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${GATEWAY_SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${GATEWAY_SSL_KEY_ALIAS:gateway}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

game:
  gateway:
    region:
      enabled: true
      default-region: cn-east
      default-edge-pop: pop-shanghai
    observe:
      enabled: true
      http-enabled: true
      ws-enabled: true
      sample-rate: 1.0
      log-level: INFO
    auth:
      enabled: true
      whitelist:
        - /api/security/public-key
        - /api/security/session-key
    rate-limit:
      enabled: true
      total-per-second: 2000
      user-per-second: 30
      whitelist: []
