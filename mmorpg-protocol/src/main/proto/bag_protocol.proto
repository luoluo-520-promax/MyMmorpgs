syntax = "proto3";

package mmorpg.bag;

option java_multiple_files = true;
option java_package = "cn.itcast.demo.mymmorpg.protocol.protobuf";
option java_outer_classname = "BagProtocolProto";

// ---------- 701 / 702 获取背包信息 ----------

message BagItemInfo {
  uint64 item_uid = 1;
  uint32 item_id = 2;
  string item_name = 3;
  uint32 count = 4;
  bool bind = 5;
  uint32 item_kind = 6;
  uint32 level_required = 7;
  string description = 8;
  uint32 equip_slot = 9; // 0=未穿戴，>0=装备槽位
  uint32 attack_bonus = 10;
  uint32 defense_bonus = 11;
}


message BagInfo {
  uint32 capacity = 1;
  uint32 used_slots = 2;
  repeated BagItemInfo items = 3;
}

message GetBagInfoCsReq {}

message GetBagInfoScRsp {
  int32 retcode = 1;
  uint32 capacity = 2;
  uint32 used_slots = 3;
  repeated BagItemInfo items = 4;
  bool loading = 5;
}

// ---------- 703 / 704 使用物品 ----------

message UseItemCsReq {
  uint64 item_uid = 1;
  uint32 count = 2;
  uint32 target_param = 3;
}

message ItemEffectResult {
  uint32 exp_gained = 1;
  uint32 hp_restored = 2;
  uint32 mp_restored = 3;
  repeated uint32 buff_ids = 4;
}

message UseItemScRsp {
  int32 retcode = 1;
  uint64 item_uid = 2;
  uint32 used_count = 3;
  ItemEffectResult effect_result = 4;
  BagInfo bag_info = 5;
}

// ---------- 705 / 706 丢弃物品 ----------

message DiscardItemCsReq {
  uint64 item_uid = 1;
  uint32 count = 2;
}

message DiscardItemScRsp {
  int32 retcode = 1;
  uint64 item_uid = 2;
  uint32 discarded_count = 3;
}

// ---------- 707 / 708 整理背包 ----------

message SortBagCsReq {
  uint32 sort_type = 1;
}

message SortBagScRsp {
  int32 retcode = 1;
  repeated BagItemInfo items = 2;
}

// ---------- 709 / 710 出售物品 ----------

message SellItemCsReq {
  uint64 item_uid = 1;
  uint32 count = 2;
}

message SellItemScRsp {
  int32 retcode = 1;
  uint64 item_uid = 2;
  uint32 sold_count = 3;
  uint32 currency_gained = 4;
  BagItemInfo remaining_items = 5;
}

// ---------- 711 背包异步加载完成通知 ----------

message BagDataReadyScNotify {
  uint32 capacity = 1;
  uint32 used_slots = 2;
  repeated BagItemInfo items = 3;
}

// ---------- 713 / 714 穿戴装备 ----------

message EquipItemCsReq {
  uint64 item_uid = 1;
}

message EquipItemScRsp {
  int32 retcode = 1;
  uint64 item_uid = 2;
  uint32 equip_slot = 3;
  BagInfo bag_info = 4;
}

// ---------- 715 / 716 卸下装备 ----------

message UnequipItemCsReq {
  uint32 equip_slot = 1;
}

message UnequipItemScRsp {
  int32 retcode = 1;
  uint32 equip_slot = 2;
  BagInfo bag_info = 3;
}
