spring:
  application:
    name: activity-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB_ACTIVITY:activity_db}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8992

rocketmq:
  enabled: false
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}

shop:
  mq:
    topic: ${SHOP_MQ_TOPIC:SHOP_EVENTS}
    consumer-group: ${SHOP_MQ_CONSUMER_GROUP:activity-shop-consumer}

battle:
  mq:
    topic: ${BATTLE_MQ_TOPIC:BATTLE_EVENTS}
    activity-consumer-group: ${BATTLE_MQ_ACTIVITY_CONSUMER_GROUP:activity-battle-consumer}

game:
  player-preload:
    enabled: false
  data-warmup:
    enabled: false
  internal-api:
    enabled: ${GAME_INTERNAL_API_ENABLED:true}
    secret: ${INTERNAL_API_SECRET:}
  port:
    remote:
      enabled: ${GAME_PORT_REMOTE_ENABLED:false}
      player-service-url: ${PLAYER_SERVICE_URL:http://127.0.0.1:8989}
      bag-service-url: ${BAG_SERVICE_URL:http://127.0.0.1:8983}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
