spring:
  config:
    activate:
      on-profile: prod
  datasource:
    password: ${MYSQL_PASSWORD:}

game:
  internal-api:
    enabled: true
    secret: ${INTERNAL_API_SECRET:}
  # 独立活动服必须走远程背包发奖，禁止默认 NoOp
  port:
    remote:
      enabled: true
      bag-service-url: ${BAG_SERVICE_URL}

rocketmq:
  enabled: ${ROCKETMQ_ENABLED:true}

activity:
  reward:
    outbox-enabled: true
  world-boss:
    max-hit-damage: ${WORLD_BOSS_MAX_HIT_DAMAGE:500000}
