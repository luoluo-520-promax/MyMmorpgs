spring:
  application:
    name: chat-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml

server:
  port: 8982

game:
  internal-api:
    enabled: ${GAME_INTERNAL_API_ENABLED:true}
    secret: ${INTERNAL_API_SECRET:}
  port:
    remote:
      enabled: ${GAME_PORT_REMOTE_ENABLED:false}
      player-service-url: ${PLAYER_SERVICE_URL:http://127.0.0.1:8989}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
