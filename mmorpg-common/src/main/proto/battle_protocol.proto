syntax = "proto3";

package mmorpg.battle;

option java_multiple_files = true;
option java_package = "cn.itcast.demo.mymmorpg.protocol.protobuf";
option java_outer_classname = "BattleProtocolProto";

// ---------- 公共结构 ----------

message BuffInfo {
  uint32 buff_id = 1;
  uint32 remaining_time = 2;
  uint32 stack_count = 3;
}

message BattleEntityInfo {
  uint64 entity_id = 1;
  string name = 2;
  uint32 level = 3;
  uint32 hp = 4;
  uint32 hp_max = 5;
  uint32 mp = 6;
  uint32 mp_max = 7;
  uint32 attack = 8;
  uint32 defense = 9;
  repeated BuffInfo buffs = 10;
}

// ---------- 201 / 202 开始战斗 ----------

message BattleStartCsReq {
  uint32 enemy_id = 1;
  uint32 lineup_id = 2;
  uint32 battle_type = 3;
}

message BattleStartScRsp {
  int32 retcode = 1;
  uint64 battle_id = 2;
  BattleEntityInfo enemy_info = 3;
  BattleEntityInfo player_info = 4;
  uint32 scene_id = 5;
  uint64 server_time = 6;
}

// ---------- 203 / 204 战斗动作 ----------

message BattleActionCsReq {
  uint64 battle_id = 1;
  uint32 action_type = 2;
  uint32 skill_id = 3;
  uint32 item_id = 4;
  uint64 target_entity_id = 5;
  uint64 timestamp = 6;
}

message EffectInfo {
  uint32 effect_type = 1;
  uint64 target_entity_id = 2;
  uint32 buff_id = 3;
  uint32 attr_type = 4;
  uint32 new_value = 5;
}

message BattleActionScRsp {
  int32 retcode = 1;
  uint64 battle_id = 2;
  uint64 action_id = 3;
  uint32 damage = 4;
  uint32 heal = 5;
  repeated EffectInfo effects = 6;
}

// ---------- 205 战斗状态同步通知 ----------

message EntityUpdate {
  uint64 entity_id = 1;
  uint32 hp = 2;
  uint32 mp = 3;
  uint32 attack = 4;
  uint32 defense = 5;
  uint32 level = 6;
}

message BuffUpdate {
  uint64 entity_id = 1;
  uint32 buff_id = 2;
  uint32 action = 3;
  uint32 remaining_time = 4;
  uint32 stack_count = 5;
}

message TurnInfo {
  uint64 current_actor_id = 1;
  uint32 turn_number = 2;
  uint32 time_limit = 3;
}

message BattleSyncScNotify {
  uint64 battle_id = 1;
  uint32 sync_type = 2;
  repeated EntityUpdate entity_updates = 3;
  repeated BuffUpdate buff_updates = 4;
  TurnInfo turn_info = 5;
}

// ---------- 206 / 207 战斗结束 ----------

message BattleEndCsReq {
  uint64 battle_id = 1;
  uint32 result = 2;
  uint32 duration = 3;
  uint32 damage_dealt = 4;
  uint32 damage_taken = 5;
}

message ItemReward {
  uint32 item_id = 1;
  uint32 count = 2;
}

message BattleEndScRsp {
  int32 retcode = 1;
  uint64 battle_id = 2;
  uint32 player_exp = 3;
  map<uint32, uint32> currency_rewards = 4;
  repeated ItemReward item_rewards = 5;
}
