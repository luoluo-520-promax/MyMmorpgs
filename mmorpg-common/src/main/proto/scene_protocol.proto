syntax = "proto3";

package mmorpg.scene;

option java_multiple_files = true;
option java_package = "cn.itcast.demo.mymmorpg.protocol.protobuf";
option java_outer_classname = "SceneProtocolProto";

// ---------- 实体与公共结构 ----------

message EntityInfo {
  uint64 entity_id = 1;
  uint32 entity_type = 2;
  float pos_x = 3;
  float pos_y = 4;
  float pos_z = 5;
  string name = 6;
  uint32 level = 7;
  uint32 model_id = 8;
}

message AttrUpdate {
  uint64 entity_id = 1;
  uint32 attr_type = 2;
  uint32 new_value = 3;
}

// ---------- 101 / 102 进入场景 ----------

message EnterSceneCsReq {
  uint32 scene_id = 1;
  uint32 line_id = 2;
  uint32 entry_id = 3;
  float pos_x = 4;
  float pos_y = 5;
  float pos_z = 6;
}

message EnterSceneScRsp {
  int32 retcode = 1;
  uint32 scene_id = 2;
  uint32 line_id = 3;
  float pos_x = 4;
  float pos_y = 5;
  float pos_z = 6;
  repeated EntityInfo entity_list = 7;
}

// ---------- 103 / 104 当前场景信息 ----------

message GetCurSceneInfoCsReq {}

message GetCurSceneInfoScRsp {
  int32 retcode = 1;
  uint32 scene_id = 2;
  uint32 line_id = 3;
  float pos_x = 4;
  float pos_y = 5;
  float pos_z = 6;
  repeated EntityInfo entity_list = 7;
}

// ---------- 105 / 106 移动 ----------

message MoveCsReq {
  float target_x = 1;
  float target_y = 2;
  float target_z = 3;
  float speed = 4;
  uint64 timestamp = 5;
}

message MoveScRsp {
  int32 retcode = 1;
  float pos_x = 2;
  float pos_y = 3;
  float pos_z = 4;
}

// ---------- 107 实体同步通知 ----------

message SyncEntityScNotify {
  uint32 sync_type = 1;
  repeated EntityInfo entity_list = 2;
  repeated uint64 leave_entity_ids = 3;
  repeated AttrUpdate attr_updates = 4;
}

// ---------- 108 / 109 切换线路 ----------

message SwitchLineCsReq {
  uint32 target_line_id = 1;
}

message SwitchLineScRsp {
  int32 retcode = 1;
  uint32 scene_id = 2;
  uint32 line_id = 3;
  float pos_x = 4;
  float pos_y = 5;
  float pos_z = 6;
  repeated EntityInfo entity_list = 7;
}

// ---------- 110 / 111 周围实体 ----------

message GetNearbyEntitiesCsReq {
  float center_x = 1;
  float center_y = 2;
  float center_z = 3;
  float radius = 4;
}

message GetNearbyEntitiesScRsp {
  int32 retcode = 1;
  repeated EntityInfo entity_list = 2;
}
