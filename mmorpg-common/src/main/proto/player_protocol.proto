syntax = "proto3";

package mmorpg;

option java_multiple_files = true;
option java_package = "cn.itcast.demo.mymmorpg.protocol.protobuf";
option java_outer_classname = "PlayerProtocolProto";

message AccountLoginCsReq {
  string account_name = 1;
  string password = 2;
}

message PlayerProfile {
  uint64 player_id = 1;
  string player_name = 2;
  uint32 level = 3;
}

message AccountLoginScRsp {
  int32 retcode = 1;
  uint64 account_id = 2;
  repeated PlayerProfile player_list = 3;
  // 单点登录令牌：用于后续跨服/功能鉴权。
  string token = 4;
}

message SelectPlayerCsReq {
  uint64 account_id = 1;
  uint64 player_id = 2;
}

message PlayerInfo {
  uint64 player_id = 1;
  string player_name = 2;
  uint32 level = 3;
  uint32 vip_right = 4;
  uint64 server_time = 5;
}

message SelectPlayerScRsp {
  int32 retcode = 1;
  PlayerInfo player_info = 2;
}

message PlayerLogoutCsReq {
  uint32 reason = 1;
}

message PlayerLogoutScRsp {
  int32 retcode = 1;
}
